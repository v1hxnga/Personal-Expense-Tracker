name: Sync latest dashboard source

on:
  push:
    branches:
      - web-version
    paths:
      - .github/workflows/sync-latest-index.yml

permissions:
  contents: write

jobs:
  sync-index:
    runs-on: ubuntu-latest
    steps:
      - name: Check out web-version
        uses: actions/checkout@v4
        with:
          ref: web-version
          fetch-depth: 0

      - name: Apply latest local Index change
        shell: python
        run: |
          from pathlib import Path

          path = Path("Pages/Index.cshtml")
          data = path.read_bytes()
          block = (
              b'        <div class="header-badge">\r\n'
              b'            C# / ASP.NET Core\r\n'
              b'        </div>\r\n\r\n'
          )
          if block not in data:
              raise SystemExit("Expected header badge block was not found")
          path.write_bytes(data.replace(block, b"", 1))

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/sync-latest-index.yml
          git config user.name "Vihanga Induwara"
          git config user.email "vihanga728@gmail.com"
          git add Pages/Index.cshtml .github/workflows/sync-latest-index.yml
          git commit -m "Sync latest local dashboard changes"
          git push origin HEAD:web-version
